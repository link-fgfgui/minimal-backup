name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine (pure Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/**') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Resolve zstd-jni
        run: |
          mkdir -p .ci
          curl -fsSL -o .ci/zstd-jni.jar \
            https://repo1.maven.org/maven2/com/github/luben/zstd-jni/1.5.7-11/zstd-jni-1.5.7-11.jar
      - name: Engine tests
        env:
          ZSTD_JAR: ${{ github.workspace }}/.ci/zstd-jni.jar
        run: ./build.sh
      - name: Config / command parity
        run: ./tests/test-config-parity.sh

  nodes:
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 1.20.1-forge, 1.20.1-fabric, 1.21.1-neoforge, 1.21.1-fabric ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/**') }}
          restore-keys: gradle-${{ runner.os }}-${{ matrix.node }}-
      - name: Build
        run: ./gradlew :${{ matrix.node }}:buildAndCollect --console=plain
      - name: Hook tests
        if: matrix.node == '1.21.1-neoforge'
        run: ./tests/test-hooks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node }}
          path: build/libs/**/*.jar
          if-no-files-found: error


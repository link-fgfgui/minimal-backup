name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve zstd-jni
        run: |
          mkdir -p .ci
          curl -fsSL -o .ci/zstd-jni.jar \
            https://repo1.maven.org/maven2/com/github/luben/zstd-jni/1.5.7-11/zstd-jni-1.5.7-11.jar
      - name: Engine tests
        env:
          ZSTD_JAR: ${{ github.workspace }}/.ci/zstd-jni.jar
        run: ./build.sh
      - name: Config / command parity
        run: ./tests/test-config-parity.sh

  build:
    name: Build all nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/**', 'stonecutter.properties.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build all Stonecutter nodes
        run: ./gradlew buildAndCollect --console=plain
      - name: Hook tests
        run: ./tests/test-hooks.sh
      - name: Package checks
        run: ./tests/test-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-backup
          path: build/libs/**/*.jar
          if-no-files-found: error
